<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment form example</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
</head>

<body>

    <div class="row justify-content-center mt-5">
        <div class="col-md-10 offset-md-1">

            <div class="card card-outline-secondary">
                <div class="card-header">
                    <h2 class="mb-0">Payment form example</h2>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-sm-12">
                            <div id="error-msg" class="alert alert-danger">Some fields are missing.</div>
                        </div>
                    </div>
                    <div class="row mt-4">
                        <div class="col-sm-5 pb-3">
                            <label for="exampleAccount">Card#</label>
                            <input class="form-control" id="exampleAccount" placeholder="xxxxxxxxxxxxxxxx" type="text">
                        </div>
                        <div class="col-sm-3 pb-3">
                            <label for="exempleCtrl">CVV #</label>
                            <input class="form-control" id="exempleCtrl" placeholder="000" type="text">
                        </div>
                        <div class="col-sm-4 pb-3">
                            <label for="exampleAmount">Amount</label>
                            <div class="input-group">
                                <span class="input-group-text">$</span>

                                <input class="form-control" id="exampleAmount" placeholder="Amount" type="number">
                            </div>
                        </div>

                        <div class="col-md-6 pb-3">
                            <label for="exampleFirstName">First Name</label>
                            <input class="form-control" id="exampleFirstName" type="text">
                        </div>
                        <div class="col-md-6 pb-3">
                            <label for="exampleLastName">Last Name</label>
                            <input class="form-control" id="exampleLastName" type="text">
                        </div>
                        <div class="col-md-6 pb-3">
                            <label for="exampleCity">City</label>
                            <input class="form-control" id="exampleCity" type="text">
                        </div>
                        <div class="col-md-3 pb-3">
                            <label for="exampleState">State</label>
                            <select class="form-control" id="exampleState">
                                <option class="text-white bg-warning">Pick a State</option>
                                <option value="MAD">Madrid</option>
                                <option value="BAR">Barcelona</option>
                                <option value="VAL">Valencia</option>
                                <option value="BIL">Bilbao </option>
                                <option value="ZAR">Zaragoza</option>
                                <option value="MAL">Malaga</option>
                            </select>
                        </div>
                        <div class="col-md-3 pb-3">
                            <label for="exampleZip">Postal Code</label>
                            <input class="form-control" id="exampleZip" type="text">
                        </div>
                        <div class="col-md-6 pb-3">
                            <p for="exampleAccount">We Accept:</p>
                            <div class="btn-group" data-toggle="buttons">
                                <label class="btn btn-outline-secondary">
                                    <input autocomplete="off" checked id="red" name="options" type="radio">
                                    <i class="fa-brands fa-cc-mastercard"></i>
                                </label>
                                <label class="btn btn-outline-secondary">
                                    <input autocomplete="off" id="blue" name="options" type="radio">
                                    <i class="fa-brands fa-cc-visa"></i>
                                </label>
                                <label class="btn btn-outline-secondary">
                                    <input autocomplete="off" id="yellow" name="options" type="radio">
                                    <i class="fa-brands fa-cc-amex"></i>
                                </label>
                                <label class="btn btn-outline-secondary">
                                    <input autocomplete="off" id="green" name="options" type="radio">
                                    <i class="fa-brands fa-cc-apple-pay"></i>
                            </div>
                        </div>
                        <div class="col-md-6 pb-3">
                            <label for="exampleMessage">Message</label>
                            <textarea class="form-control" id="exampleMessage" rows="3"></textarea>
                            <small class="text-muted">Add any notes here</small>
                        </div>

                    </div>
                </div>
                <div class="card-footer d-flex">
                    <button class="btn btn-secondary ms-auto mx-1" type="reset"> Cancel </button>
                    <button id="sendForm" class="btn btn-primary mx-1" type="button">Send</button>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
            integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
            crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
            integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
            crossorigin="anonymous"></script>
</body>

</html>
